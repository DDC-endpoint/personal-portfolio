<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V3 spike · Lens gallery</title>
<!-- Layout mockup only. Needs EXIF-free web copies in ./gal/f01.jpg … f10.jpg (curated order, see design.md → Lens); gal/ is gitignored. -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ivory:#F6F6F1; --ink:#0B1F3A; --ink-soft:#16315A; --ink-faint:#5A6B82; --electric:#2563EB; --rule:#D9DEE6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--ivory); color:var(--ink); font-family:Manrope,sans-serif; }
  section { padding:8rem 40px 10rem; border-top:1px solid var(--rule); }
  .label { font:500 11px 'JetBrains Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft); }
  .head { display:grid; grid-template-columns:repeat(12,1fr); gap:24px; margin-bottom:6rem; }
  .head .label { grid-column:1/span 3; }
  .head > div { grid-column:4/span 9; }
  h2 { font-family:'Instrument Serif',serif; font-weight:400; font-size:clamp(3rem,6vw,4.5rem); line-height:.95; letter-spacing:-.01em; }
  h2 i { color:var(--electric); }
  .intro { margin-top:1.5rem; max-width:36rem; font-size:1.1rem; color:var(--ink-soft); }
  /* small grid: equal tiles, five across, alternate columns nudged down */
  .grid { display:grid; grid-template-columns:repeat(5,1fr); column-gap:24px; row-gap:3rem; max-width:1200px; margin-left:auto; }
  figure:nth-child(even) { transform:translateY(2.5rem); }
  figure img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
  figcaption { margin-top:.6rem; display:flex; flex-direction:column; gap:.2rem; font:400 10px 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); line-height:1.4; }
  figcaption b { font-weight:500; color:var(--ink-soft); }
  .foot { margin-top:6rem; display:flex; justify-content:space-between; align-items:end; }
  .foot a { font-family:'Instrument Serif',serif; font-style:italic; font-size:2.25rem; color:var(--ink); text-decoration:none; }
  @media (max-width: 760px) {
    section { padding:5rem 20px; } .head { display:block; margin-bottom:3rem; } .head .label { margin-bottom:1rem; }
    .grid { grid-template-columns:repeat(2,1fr); column-gap:14px; row-gap:2rem; }
    figure:nth-child(even) { transform:translateY(1.5rem); }
    .foot { flex-direction:column; align-items:flex-start; gap:1rem; }
  }
</style>
</head>
<body>
<section>
  <div class="head">
    <div class="label">§ 07 — Lens</div>
    <div>
      <h2>Off-duty, <i>through glass</i>.</h2>
      <p class="intro">Shot on a Nothing Phone (3a) Pro: light, geometry and the occasional accident. The feed is private; this is the cut I share.</p>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <p class="label" style="color:var(--ink-faint)">Private account. Request access for the full feed.</p>
    <a href="#">@nothing._.ddc ↗</a>
  </div>
</section>
<script>
const photos = [
  ['Sigiriya, from Pidurangala', 'May 2026'], ['Small tenant', 'Apr 2026'], ['Architecture at nightfall', 'May 2025'],
  ['Thalpe, low tide', 'Sep 2025'], ['Pink in the green', 'Jan 2026'], ['Above the mist, Sigiriya', 'Jan 2026'],
  ['A dahlia after dark, Nuwara Eliya', 'Jan 2026'], ['Getting lost up Ella Rock', 'Jan 2026'],
  ['Colombo skyline, blue hour', 'Oct 2025'], ['Storm light', 'Sep 2026'],
];
document.getElementById('grid').innerHTML = photos.map(([cap, when], i) => {
  const n = String(i + 1).padStart(2, '0');
  return `<figure class="f${n}"><img src="gal/f${n}.jpg" alt="${cap}" loading="lazy"><figcaption><b>Frame ${n}</b><span>${cap}</span><span>${when}</span></figcaption></figure>`;
}).join('');
</script>
</body>
</html>
